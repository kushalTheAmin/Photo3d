# Render Blueprint for Universal Play.
# In Render: New → Blueprint → pick this repo → set "Blueprint Path" to video-player/render.yaml
services:
  - type: web
    name: universal-play
    runtime: node
    rootDir: video-player
    region: oregon
    plan: free
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      - key: ALLOW_PRIVATE_NETWORKS
        value: "0"
      - key: APP_PASSWORD
        generateValue: true
