# Publishes video-player/ as a static site on GitHub Pages (free, no server).
# One-time setup: repo Settings → Pages → Source: "GitHub Actions".
name: Deploy Universal Play to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'video-player/**'
      - '.github/workflows/video-player-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: video-player
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: video-player/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Build static site
        run: npm run build
        env:
          VITE_BASE: /${{ github.event.repository.name }}/
          # Empty proxy base = static mode (GitHub Pages cannot run the Node proxy).
          VITE_PROXY_BASE: ''
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: video-player/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
